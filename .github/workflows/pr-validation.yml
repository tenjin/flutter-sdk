name: PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Test the Dart plugin
        run: flutter test
